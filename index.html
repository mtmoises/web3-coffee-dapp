<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☕ COOFEETH</title>
    <style>
        
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fcd34d, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        
        .emoji {
            -webkit-text-fill-color: initial;
            color: initial;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.98);
        }

        #connectButton {
            background-color: var(--primary);
            color: white;
        }
        #connectButton:hover {
            background-color: var(--primary-hover);
        }

        .row-buttons {
            display: flex;
            gap: 15px;
        }
        .row-buttons button {
            background-color: #334155;
            color: var(--text-main);
            border: 1px solid #475569;
        }
        .row-buttons button:hover {
            background-color: #475569;
        }

        .buy-section {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-top: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: #1e293b;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        #fundButton {
            background-color: var(--accent);
            color: #000;
            font-weight: 800;
        }
        #fundButton:hover {
            background-color: var(--accent-hover);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <h1><span class="emoji">☕</span> COOFEETH</h1>

        <div class="button-group">
            <button id="connectButton">Connect Wallet</button>
            
            <div class="row-buttons">
                <button id="balanceButton">Get Balance</button>
                <button id="withdrawButton">Withdraw</button>
            </div>
        </div>

        <div class="buy-section">
            <label for="ethAmount">Cantidad de ETH:</label>
            <input type="text" id="ethAmount" placeholder="Ej. 0.1" />
            <button id="fundButton">Buy Coffee</button>
        </div>
    </div>

    
    <script type="module" src="./index.js"></script>
</body>
</html>
